    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="reading-progress"></div>

    <main id="reader" aria-labelledby="chapter-title">

    <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Mute audio" hidden>
      <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-8.33v2.06a6.5 6.5 0 0 1 0 12.54v2.06a8.5 8.5 0 0 0 0-16.66Z" />

      <div class="intro-content">
        <p class="eyebrow">Manga chapter</p>
        <h2 id="intro-title">Balarion</h2>
        <div class="intro-actions">
          <button id="begin-button" class="begin-button" type="button">Tap to Begin</button>
          <button id="resume-button" class="resume-button" type="button" hidden>Resume where you left off</button>
        </div>
      </div>

    <audio id="ambience" loop preload="auto">
      <source src="audio/ultrasonic-sound.mp3" type="audio/mpeg" />
    </audio>
